add('Q1a','Data Analysis',1,`<p class="m">6 marks · definition + diagram + example</p><h3>Definition</h3><p>Data analysis is the process of inspecting, cleaning, transforming and modelling data to discover useful information, support conclusions and drive decisions.</p>
<h3>Importance / advantages</h3><ul><li>Evidence-based decisions, reduced guesswork and risk</li><li>Finds patterns, trends and anomalies; improves efficiency and customer insight</li><li><b>Issues:</b> poor data quality, missing values, bias, privacy, scale, wrong tool choice</li></ul>
<h3>Steps in the data analysis process</h3>${flow(['Define goal','Collect','Clean','Explore (EDA)','Model','Interpret','Communicate'],['#1f6fb2','#2a8a5a','#d9772b','#7b4ab8'])}
<table><tr><th>Step</th><th>What happens</th></tr><tr><td>Define</td><td>State the question and success metric</td></tr><tr><td>Collect</td><td>Surveys, logs, databases, APIs, sensors</td></tr><tr><td>Clean</td><td>Handle missing values, duplicates, outliers, types</td></tr><tr><td>Explore</td><td>Summary stats, plots, correlations</td></tr><tr><td>Model</td><td>Regression, classification, clustering</td></tr><tr><td>Interpret / Communicate</td><td>Validate, build dashboards and reports</td></tr></table>
<h3>Example</h3><pre><span class="k">import</span> pandas <span class="k">as</span> pd
df=pd.read_csv(<span class="s">"sales.csv"</span>)
df=df.drop_duplicates().fillna(df.mean(numeric_only=<span class="k">True</span>))   <span class="c"># clean</span>
print(df.describe()); df.groupby(<span class="s">"region"</span>).sales.sum()   <span class="c"># explore</span></pre>
<table><tr><th>Type</th><th>Answers</th></tr><tr><td>Descriptive</td><td>What happened?</td></tr><tr><td>Diagnostic</td><td>Why?</td></tr><tr><td>Predictive</td><td>What will happen?</td></tr><tr><td>Prescriptive</td><td>What should we do?</td></tr></table>`);
add('Q1b','Apriori Algorithm',1,`<p class="m">6 marks · definition + diagram + example</p><h3>Definition</h3><p>Apriori finds <b>frequent itemsets</b> and generates <b>association rules</b> using the <i>Apriori property</i>: every subset of a frequent itemset must itself be frequent (so supersets of infrequent sets are pruned).</p>
<h3>Components</h3><table><tr><th>Term</th><th>Formula</th></tr><tr><td>Support(A)</td><td>count(A)/N</td></tr><tr><td>Confidence(A→B)</td><td>support(A∪B)/support(A)</td></tr><tr><td>Lift(A→B)</td><td>confidence/support(B) (&gt;1 positive link)</td></tr><tr><td>Candidate set C<sub>k</sub> / Frequent set L<sub>k</sub></td><td>k-itemsets generated / those meeting min support</td></tr></table>
<h3>Steps</h3>${S(640,80,B(5,20,100,38,'Scan DB → C1','#1f6fb2')+A(105,39,125,39)+B(127,20,100,38,'Prune → L1','#2a8a5a')+A(227,39,247,39)+B(249,20,110,38,'Join → C2, prune','#d9772b')+A(359,39,379,39)+B(381,20,100,38,'L2 … Lk','#7b4ab8')+A(481,39,501,39)+B(503,20,130,38,'Rules ≥ min conf','#c0392b'))}
<h3>Example (min support = 2 of 4)</h3><p>T1{Bread,Milk} T2{Bread,Butter,Milk} T3{Butter,Milk} T4{Bread,Butter}</p><table><tr><th>Level</th><th>Itemsets (count)</th></tr><tr><td>L1</td><td>Bread 3, Milk 3, Butter 3</td></tr><tr><td>L2</td><td>{Br,Mi}2, {Br,Bu}2, {Mi,Bu}2</td></tr><tr><td>C3</td><td>{Br,Mi,Bu}=1 → pruned</td></tr></table><p>Rule Bread→Milk: confidence = 2/3 = 67%.</p>
<p><b>Pros:</b> simple, easy to implement. <b>Cons:</b> many database scans, huge candidate sets.</p>`);
const km=`${S(420,230,'<line x1="30" y1="200" x2="400" y2="200" stroke="#444"/><line x1="30" y1="200" x2="30" y2="15" stroke="#444"/>'+[[70,60],[95,85],[60,100],[90,50],[110,100]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#1f6fb2"/>`).join('')+[[230,150],[260,170],[215,180],[250,140]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#2a8a5a"/>`).join('')+[[340,50],[365,75],[330,85]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#d9772b"/>`).join('')+'<path d="M86 75l8 8m0-8l-8 8" stroke="#000" stroke-width="3"/><path d="M236 154l8 8m0-8l-8 8" stroke="#000" stroke-width="3"/><path d="M346 62l8 8m0-8l-8 8" stroke="#000" stroke-width="3"/>'+T(110,130,'C1')+T(260,195,'C2')+T(350,110,'C3')+T(215,225,'✕ = centroid; points join nearest centroid'))}`;
add('Q1c','K-Means Clustering',1,`<p class="m">8 marks · definition + diagram + example + explanation</p><h3>Definition</h3><p>K-Means is an unsupervised, centroid-based algorithm that partitions n points into k clusters by minimising the within-cluster sum of squares (WCSS/inertia).</p>${km}
<h3>Algorithm</h3><ol><li>Choose k; pick k initial centroids (random / k-means++).</li><li><b>Assign</b> each point to nearest centroid (Euclidean distance).</li><li><b>Update</b> each centroid to the mean of its points.</li><li>Repeat 2–3 until centroids stop moving or max iterations.</li></ol><p class="fm">J = Σ<sub>j</sub> Σ<sub>x∈Cj</sub> ‖x − μ<sub>j</sub>‖²</p>
<h3>Example</h3><p>Data 2,3,4,10,11,12,20,25,30, k=2 with starts 2 and 4 → converges to C1={2,3,4,10,11,12} (mean 7) and C2={20,25,30} (mean 25).</p>
<h3>Choosing k</h3><p><b>Elbow method</b> (plot inertia vs k, pick the bend), <b>silhouette score</b> (max), gap statistic.</p>
<pre><span class="k">from</span> sklearn.cluster <span class="k">import</span> KMeans
km=KMeans(n_clusters=3,n_init=10).fit(X)
print(km.labels_, km.cluster_centers_, km.inertia_)</pre>
<h3>Applications</h3><p>Customer segmentation, image compression, document grouping, anomaly detection, market basket profiling.</p><p><b>Limits:</b> k must be known, sensitive to outliers/initialisation, assumes spherical clusters.</p>`);
// ---------- Q2
add('Q2a','Linear Regression',1,`<p class="m">6 marks · definition + diagram + example</p><h3>Definition</h3><p>Regression models the relationship between a dependent variable y and independent variable(s) x to predict continuous values. <b>Simple linear regression:</b></p><p class="fm">y = β0 + β1·x + ε &nbsp; β1 = Σ(x−x̄)(y−ȳ)/Σ(x−x̄)² , β0 = ȳ − β1·x̄</p>
${S(380,220,'<line x1="40" y1="190" x2="360" y2="190" stroke="#444"/><line x1="40" y1="190" x2="40" y2="15" stroke="#444"/>'+[[80,150],[120,110],[160,100],[200,115],[240,85],[280,70],[320,50]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#1f6fb2"/>`).join('')+'<line x1="60" y1="150" x2="340" y2="45" stroke="#d9772b" stroke-width="2.5"/><line x1="200" y1="115" x2="200" y2="97" stroke="#c0392b" stroke-dasharray="3"/>'+T(210,108,'residual','start')+T(330,38,'best-fit line','end')+T(200,212,'x (independent)')+T(14,100,'y'))}
<h3>Example</h3><p>x=1..5, y=2,4,5,4,5: x̄=3, ȳ=4, Sxy=6, Sxx=10 → β1=0.6, β0=2.2. Prediction at x=6: ŷ = 5.8.</p>
<pre>LinearRegression().fit(X,y).coef_   <span class="c"># sklearn</span></pre><table><tr><th>Advantages</th><th>Disadvantages</th></tr><tr><td>Simple, interpretable, fast</td><td>Assumes linearity</td></tr><tr><td>Few parameters, little tuning</td><td>Sensitive to outliers</td></tr><tr><td>Basis for multiple regression</td><td>Multicollinearity hurts multiple regression</td></tr></table>
<p><b>Simple vs multiple:</b> one predictor vs two or more (y=β0+β1x1+…+βnxn).</p>`);
add('Q2b','Clustering Metrics &amp; DBSCAN vs K-Means',1,`<p class="m">6 marks · definition + diagram + example/table</p><h3>Evaluation metrics</h3><table><tr><th>Metric</th><th>Meaning</th></tr><tr><td>Inertia</td><td>Σ squared distance of points to their centroid; lower = tighter (elbow method)</td></tr><tr><td>Dunn Index</td><td>min inter-cluster distance ÷ max intra-cluster diameter; higher = better</td></tr><tr><td>Silhouette</td><td>s=(b−a)/max(a,b); a=mean distance in own cluster, b=to nearest other cluster; range −1…1</td></tr></table>
<h3>DBSCAN (density-based)</h3><p>Parameters <b>eps</b> (radius) and <b>MinPts</b>. <b>Core</b>: ≥MinPts neighbours in eps; <b>border</b>: within eps of a core; <b>noise</b>: neither.</p>
${S(380,160,'<circle cx="120" cy="80" r="55" fill="none" stroke="#2a8a5a" stroke-dasharray="4"/>'+[[100,70],[125,60],[135,90],[110,95],[90,95]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#2a8a5a"/>`).join('')+'<circle cx="170" cy="85" r="5" fill="#d9772b"/><circle cx="300" cy="40" r="5" fill="#c0392b"/><circle cx="330" cy="130" r="5" fill="#c0392b"/>'+T(120,150,'core')+T(172,105,'border')+T(300,30,'noise'))}
<table><tr><th>Basis</th><th>K-Means</th><th>DBSCAN</th></tr><tr><td>k needed?</td><td>Yes</td><td>No (eps, MinPts)</td></tr><tr><td>Shape</td><td>Spherical</td><td>Arbitrary</td></tr><tr><td>Outliers</td><td>Sensitive</td><td>Labelled as noise</td></tr><tr><td>Density variation</td><td>n/a</td><td>Struggles</td></tr><tr><td>Speed</td><td>Fast, O(nkt)</td><td>O(n log n) with index</td></tr></table>
<p><b>Clustering vs regression:</b> clustering is unsupervised (groups unlabeled data); regression is supervised (predicts a numeric target).</p>`);
add('Q2c','Naive Bayes Classifier',1,`<p class="m">8 marks · definition + diagram + example + explanation</p><h3>Definition</h3><p>Classification assigns a data item to a predefined class using a model learned from labelled data. Naive Bayes is a probabilistic classifier based on Bayes' theorem with the “naive” assumption that features are conditionally independent given the class.</p><p class="fm">P(C|X) = P(X|C)·P(C) / P(X) &nbsp;&nbsp; P(C|x1..xn) ∝ P(C)·ΠP(xi|C)</p>
${S(380,150,B(150,8,80,32,'Class C','#7b4ab8')+[0,1,2].map(i=>A(190,40,70+i*120,95)+B(30+i*120,96,80,32,'x'+(i+1),'#1f6fb2')).join('')+T(190,145,'features independent given class'))}
<h3>Example (spam filter)</h3><p>P(spam)=0.4, P(ham)=0.6; P("offer"|spam)=0.6, P("offer"|ham)=0.1.</p><p class="fm">P(spam|offer) = 0.6·0.4 / (0.6·0.4 + 0.1·0.6) = 0.24/0.30 = 0.80 → classify as spam</p>
<h3>Working</h3><ol><li>Compute class priors.</li><li>Compute likelihoods per feature (Laplace smoothing avoids zeros).</li><li>Multiply and pick the class with highest posterior.</li></ol>
<p><b>Variants:</b> Gaussian, Multinomial, Bernoulli. <b>Applications:</b> spam filtering, sentiment analysis, document categorisation, medical diagnosis, recommendation.</p><p><b>Pros:</b> fast, works with small data. <b>Cons:</b> independence assumption rarely true.</p>`);
// ---------- Q3
add('Q3a','Decision Tree, Entropy &amp; Gini',2,`<p class="m">8 marks · definition + diagram + example + explanation</p><h3>Definition</h3><p>A decision tree is a supervised, flowchart-like model: internal nodes test attributes, branches are outcomes, leaves hold class labels (classification) or values (regression).</p>
${S(480,230,B(185,8,110,34,'Outlook?','#2a8a5a')+A(215,42,90,98)+A(240,42,240,98)+A(265,42,390,98)+T(130,70,'Sunny')+T(255,72,'Overcast','start')+T(350,70,'Rain')+B(35,100,110,34,'Humidity?','#1f6fb2')+B(185,100,110,34,'YES','#27ae60')+B(335,100,110,34,'Wind?','#1f6fb2')+A(70,134,45,185)+A(110,134,135,185)+T(35,160,'High')+T(130,160,'Normal')+B(5,186,80,30,'NO','#c0392b')+B(100,186,80,30,'YES','#27ae60')+A(370,134,350,185)+A(410,134,440,185)+T(335,160,'Strong')+T(445,160,'Weak')+B(305,186,80,30,'NO','#c0392b')+B(400,186,80,30,'YES','#27ae60'))}
<h3>Splitting measures</h3><table><tr><th>Measure</th><th>Formula</th></tr><tr><td>Entropy</td><td>H(S) = −Σ p<sub>i</sub> log₂ p<sub>i</sub></td></tr><tr><td>Information Gain</td><td>IG(S,A) = H(S) − Σ (|S<sub>v</sub>|/|S|)·H(S<sub>v</sub>)</td></tr><tr><td>Gini Index</td><td>G = 1 − Σ p<sub>i</sub>²</td></tr></table>
<h3>Root selection example (play-tennis, 9 Yes / 5 No)</h3><p class="fm">H(S) = −(9/14)log₂(9/14) − (5/14)log₂(5/14) = 0.940</p><p>Gain(Outlook)=0.247, Humidity=0.152, Wind=0.048, Temp=0.029 → <b>Outlook has max gain, becomes the root.</b> Repeat recursively on each branch until pure or no attributes left.</p>
<p><b>Terminology:</b> root, internal node, leaf, branch, depth, pruning (pre/post) to avoid overfitting. <b>Algorithms:</b> ID3 (IG), C4.5 (gain ratio), CART (Gini).</p>`);
add('Q3b','Random Forest',2,`<p class="m">8 marks · definition + diagram + example + explanation</p><h3>Definition</h3><p>Random Forest is an ensemble of many decision trees trained on bootstrap samples (bagging) with a random subset of features at each split. Output = majority vote (classification) or average (regression).</p>

<table><tr><th>Decision Tree</th><th>Random Forest</th></tr><tr><td>Single tree</td><td>Many trees, aggregated</td></tr><tr><td>Overfits easily</td><td>Reduces variance and overfitting</td></tr><tr><td>Highly interpretable</td><td>Less interpretable</td></tr><tr><td>Fast</td><td>Slower, more memory</td></tr></table>

<h3>Feed-forward NN and Backpropagation</h3>${S(420,130,[0,1,2].map(i=>`<circle cx="50" cy="${25+i*40}" r="12" fill="#1f6fb2"/>`).join('')+[0,1,2,3].map(i=>`<circle cx="190" cy="${15+i*34}" r="12" fill="#2a8a5a"/>`).join('')+[0,1].map(i=>`<circle cx="340" cy="${42+i*40}" r="12" fill="#d9772b"/>`).join('')+[0,1,2].flatMap(i=>[0,1,2,3].map(j=>`<line x1="62" y1="${25+i*40}" x2="178" y2="${15+j*34}" stroke="#999" stroke-width=".6"/>`)).join('')+[0,1,2,3].flatMap(i=>[0,1].map(j=>`<line x1="202" y1="${15+i*34}" x2="328" y2="${42+j*40}" stroke="#999" stroke-width=".6"/>`)).join('')+T(50,125,'Input')+T(190,125,'Hidden')+T(340,125,'Output'))}
<p>Data flows forward only. <b>Backpropagation:</b> (1) forward pass, (2) compute error E=½(t−y)², (3) propagate gradient backward by chain rule, (4) update weights.</p><p class="fm">w ← w − η·∂E/∂w</p><p><b>Disadvantages of FFNN:</b> needs lots of data, slow training, local minima, black box.</p>`);
add('Q4b','MapReduce &amp; CAPTCHA',2,`<p class="m">8 marks · two short notes</p><h3>MapReduce</h3><p>A programming model for processing large data in parallel on a cluster (Hadoop): <b>Map</b> emits (key,value) pairs, <b>Shuffle/Sort</b> groups by key, <b>Reduce</b> aggregates.</p>

<pre><span class="k">def</span> map(line):    <span class="k">for</span> w <span class="k">in</span> line.split(): emit(w,1)

add('Q5a','Box Plot Construction',3,`<p class="m">8 marks · definition + diagram + working</p><h3>Definition</h3><p>A box plot shows the five-number summary (min, Q1, median, Q3, max); the box is the IQR, whiskers extend to the furthest non-outlier values, and points beyond 1.5×IQR from the box are outliers.</p>

<pre><span class="k">import</span> matplotlib.pyplot <span class="k">as</span> plt

<p class="m">Other papers: data 100..220 → median 125, Q1 110, Q3 145, IQR 35, fences 57.5/197.5, outlier 220. Data 25..38 → median 32, Q1 29, Q3 35, no outliers.</p>`);
add('Q5b','Charts: Bar, Histogram, Scatter, Pie, Area, Heatmap',3,`<p class="m">8 marks · definitions + diagram + comparison</p>

add('Q6a','Data Dashboard',3,`<p class="m">8 marks · definition + diagram + steps</p><h3>Definition</h3><p>A data dashboard is a single-screen, interactive display of key metrics (KPIs) and visualisations that supports monitoring and decisions. <b>Dashboard vs visualization:</b> a visualization is one chart; a dashboard combines many linked charts and KPIs.</p>
${S(480,200,'<rect x="5" y="5" width="470" height="26" fill="#d9772b"/>'+T(15,23,'Header: title · filters · date range','start').replace('<text','<text style="fill:#fff"')+[0,1,2].map(i=>B(5+i*160,40,150,36,['KPI: Revenue','KPI: Orders','KPI: Churn'][i],'#2a8a5a')).join('')+'<rect x="5" y="86" width="230" height="105" fill="none" stroke="#1f6fb2" stroke-width="2"/><polyline points="20,170 70,140 120,150 170,115 220,100" fill="none" stroke="#1f6fb2" stroke-width="3"/>'+T(120,102,'Trend line (main chart)')+'<rect x="245" y="86" width="110" height="105" fill="none" stroke="#7b4ab8" stroke-width="2"/>'+T(300,140,'Bar chart')+'<circle cx="420" cy="138" r="40" fill="none" stroke="#c0392b" stroke-width="2"/>'+T(420,142,'Pie'))}

<h3>Steps to build an effective dashboard</h3><ol><li>Define audience and goals/KPIs.</li><li>Collect and clean data sources.</li><li>Choose the right chart for each metric.</li><li>Layout: most important top-left, group related items, whitespace.</li><li>Consistent colour, minimal clutter, add filters/drill-down.</li><li>Test with users, iterate, automate refresh.</li></ol>

add('Q6b','Heatmap vs Correlation &amp; Covariance',3,`<p class="m">8 marks · definition + diagram + comparison table</p><h3>Definition</h3><p>A heatmap represents values of a matrix as colours (darker/warmer = larger), revealing patterns, clusters and hotspots. <b>Uses:</b> correlation matrices, gene expression, website click maps, confusion matrices. <b>Use when</b> you have many variables/cells to scan quickly.</p>
${S(300,190,[[1,.8,-.5],[.8,1,-.2],[-.5,-.2,1]].map((r,i)=>r.map((v,j)=>`<rect x="${60+j*60}" y="${25+i*50}" width="58" height="48" fill="${v>0?'#c0392b':'#1f6fb2'}" opacity="${.25+Math.abs(v)*.75}"/>`+T(89+j*60,53+i*50,v)).join('')).join('')+T(89,18,'A')+T(149,18,'B')+T(209,18,'C')+T(160,182,'Correlation heatmap (red +, blue −)'))}

add('Q7a','Principal Component Analysis',4,`<p class="m">9 marks · definition + diagram + steps + terminology</p><h3>Definition</h3><p>PCA is an unsupervised linear dimensionality-reduction technique that projects data onto new orthogonal axes (principal components) that capture maximum variance.</p>
${S(380,230,[[90,170],[130,150],[160,130],[200,110],[230,95],[270,80],[140,160],[210,125],[250,100],[180,115]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#7b4ab8"/>`).join('')+'<line x1="60" y1="190" x2="320" y2="60" stroke="#d9772b" stroke-width="3" marker-end="url(#ar)"/><line x1="200" y1="160" x2="240" y2="200" stroke="#2a8a5a" stroke-width="2.5" marker-end="url(#ar)"/>'+T(325,55,'PC1 (max variance)','end')+T(250,215,'PC2 ⟂ PC1'))}
<h3>Terminology</h3><table><tr><th>Term</th><th>Meaning</th></tr><tr><td>Variance</td><td>Spread of data along an axis</td></tr><tr><td>Covariance matrix</td><td>Pairwise feature covariances</td></tr><tr><td>Eigenvector / eigenvalue</td><td>Direction of a PC / variance it explains</td></tr><tr><td>Explained variance ratio</td><td>λi/Σλ</td></tr></table>
<h3>Steps</h3><ol><li>Standardise data (mean 0, unit variance).</li><li>Compute covariance matrix.</li><li>Find eigenvalues and eigenvectors.</li><li>Sort by eigenvalue; keep top k components.</li><li>Project: Z = X·W<sub>k</sub>.</li></ol>
<pre><span class="k">from</span> sklearn.decomposition <span class="k">import</span> PCA
Z=PCA(n_components=2).fit_transform(StandardScaler().fit_transform(X))</pre>
<p><b>Advantages:</b> removes correlated features, reduces noise and overfitting, enables 2-D visualisation. <b>Disadvantages:</b> linear only, components hard to interpret, sensitive to scaling, some information loss.</p>`);
add('Q7b','Sammon Mapping &amp; SOM',4,`<p class="m">9 marks · definition + diagram + comparison</p><h3>Sammon mapping</h3><p>A non-linear mapping that projects high-dimensional points to 2-D/3-D while preserving inter-point distances, minimising the Sammon stress (small distances are weighted more):</p><p class="fm">E = (1/Σ d*<sub>ij</sub>) · Σ<sub>i&lt;j</sub> (d*<sub>ij</sub> − d<sub>ij</sub>)² / d*<sub>ij</sub></p><p>(d* = original distance, d = mapped distance; minimised by gradient descent.)</p>
<table><tr><th>PCA</th><th>Sammon mapping</th></tr><tr><td>Linear, variance-preserving</td><td>Non-linear, distance-preserving</td></tr><tr><td>Closed-form (eigen)</td><td>Iterative, may hit local minima</td></tr><tr><td>Fast, has projection for new data</td><td>Slow, no direct mapping for new points</td></tr><tr><td>Large distances dominate</td><td>Local structure preserved better</td></tr></table>
<h3>Self-Organizing Map (Kohonen)</h3><p>An unsupervised neural network that maps high-dimensional input to a 2-D grid of neurons, preserving topology.</p>
${S(420,180,[0,1,2].map(i=>B(10,20+i*45,60,30,'x'+(i+1),'#1f6fb2')).join('')+[0,1,2,3].flatMap(r=>[0,1,2,3].map(c=>`<rect x="${200+c*40}" y="${15+r*40}" width="36" height="36" fill="${(r==1&&c==2)?'#d9772b':'#2a8a5a'}" opacity="${(r==1&&c==2)?1:.45}"/>`)).join('')+A(70,35,195,60)+A(70,80,195,60)+A(70,125,195,60)+T(280,178,'Output grid (BMU in orange)'))}
<ol><li>Initialise weights randomly.</li><li>For each input find the Best Matching Unit (min distance).</li><li>Update BMU and neighbours: w ← w + η·h(t)·(x−w).</li><li>Shrink learning rate and neighbourhood; repeat.</li></ol><p><b>Applications:</b> clustering, data visualisation, speech and image analysis, customer segmentation.</p>`);

add('Q8a','Clustering High-Dimensional Data',4,`<p class="m">9 marks · definition + diagram + challenges + methods</p><h3>Definition</h3><p>Clustering data with tens to thousands of attributes (text, genomics, images), where many dimensions are irrelevant and clusters exist only in subspaces.</p>
<h3>Challenges</h3><ul><li><b>Curse of dimensionality:</b> distances concentrate, nearest and farthest points become similar</li><li>Data sparsity, irrelevant/noisy features</li><li>Different clusters live in different subspaces</li><li>High computation cost, hard interpretation and visualisation</li></ul>
${S(560,100,B(5,30,100,36,'High-dim data','#444')+A(105,48,155,25)+A(105,48,155,70)+B(157,5,160,36,'Dimension reduction','#1f6fb2')+B(157,55,160,36,'Subspace clustering','#2a8a5a')+A(317,23,367,48)+A(317,73,367,48)+B(369,30,185,36,'Clusters + interpretation','#d9772b'))}
<h3>Methods</h3><table><tr><th>Approach</th><th>Idea / example</th></tr><tr><td>Dimensionality reduction + clustering</td><td>PCA/SVD, t-SNE, then K-Means</td></tr><tr><td>Subspace clustering</td><td>CLIQUE (grid, bottom-up), SUBCLU</td></tr><tr><td>Projected clustering</td><td>PROCLUS: each cluster has its own dimension set</td></tr><tr><td>Correlation clustering</td><td>Clusters by arbitrarily oriented correlations</td></tr><tr><td>Feature selection / bi-clustering</td><td>Cluster rows and columns together</td></tr></table>
<pre>X2=PCA(50).fit_transform(X); labels=KMeans(8).fit_predict(X2)</pre>`);
add('Q8b','SPLOM, Parallel Coordinates, Tree Map',4,`<p class="m">9 marks · 3 techniques × diagram</p>

const FM=[['Support / Confidence / Lift','sup(A)=count(A)/N · conf(A→B)=sup(A∪B)/sup(A) · lift=conf/sup(B)'],['K-Means objective','J = Σ Σ ‖x − μj‖²'],['Silhouette','s = (b − a) / max(a, b)'],['Linear regression','β1 = Sxy/Sxx · β0 = ȳ − β1·x̄'],['Bayes theorem','P(C|X) = P(X|C)·P(C) / P(X)'],['Entropy / Gain / Gini','H = −Σ p log₂p · IG = H(S) − Σ(|Sv|/|S|)H(Sv) · G = 1 − Σp²'],['Perceptron / update','y = step(Σwx + b) · w ← w − η ∂E/∂w'],['Box plot','IQR = Q3 − Q1 · fences Q1 − 1.5·IQR, Q3 + 1.5·IQR'],['Correlation / covariance','r = cov(X,Y)/(σxσy) · cov = Σ(x−x̄)(y−ȳ)/(n−1)'],['PCA','Z = X·Wk · explained variance = λi / Σλ'],['Sammon stress','E = (1/Σd*) Σ (d* − d)² / d*']];
